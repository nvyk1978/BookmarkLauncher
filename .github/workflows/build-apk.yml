name: Build BookmarkLauncher

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o source.zip
          rm -f source.zip
          test -f settings.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BookmarkLauncher_0.1.0.apk
          zip -r source.zip . \
            -x '.git/*' \
               '.gradle/*' \
               '**/build/*' \
               'BookmarkLauncher_0.1.0.apk' \
               'source.zip'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookmarkLauncher_0.1.0
          path: BookmarkLauncher_0.1.0.apk

      - name: Upload source.zip
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: source.zip
