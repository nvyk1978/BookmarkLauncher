name: Build BookmarkLauncher APK

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_NAME: BookmarkLauncher
  EXPECTED_CERT_SHA256: E5EF52E26F058D31549535A70407F61C8AF13D0A7DA4400FF635E8F385F7A493

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Unpack source
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q source.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/scripts/prepare-build.sh

      - name: Repair and verify build invariants
        shell: bash
        run: |
          cd project
          bash scripts/prepare-build.sh

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug --stacktrace

      - name: Verify fixed APK signature
        shell: bash
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')
          test -n "$ACTUAL_CERT_SHA256"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: signing certificate mismatch" >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi

      - name: Name APK
        shell: bash
        run: |
          mkdir -p out
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" project/app/build.gradle | head -n1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' project/app/build.gradle | head -n1)
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -ge 63
          cp project/app/build/outputs/apk/debug/app-debug.apk "out/BookmarkLauncher_${VERSION}.apk"
          test -s "out/BookmarkLauncher_${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
